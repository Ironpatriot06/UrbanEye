    name: "RDD2022 Road Damage Dataset"
    url: "https://figshare.com/articles/dataset/RDD2022_-_The_multi-national_Road_Damage_Dataset_released_through_CRDDC_2022/21431547"
    licence: "Read from the Figshare record at download time — UNVERIFIED here"
    required_now: false
    future_purpose: "image -> road damage detection, if UrbanEye+ ever auto-detects category from a photo"
    why_not_now: "The citizen selects the category in the app, so image->category is out of scope."
  smartathon:
    name: "SDAIA Smartathon Theme 1 (Visual Pollution)"
    url: "https://smartathon.hackerearth.com/"
    licence: "UNVERIFIED at original source; Roboflow mirror declares CC BY 4.0"
    required_now: false
    future_purpose: "multi-class civic image detection"
    why_not_now: "Out of ML scope, and the original licence could not be confirmed."
  taco:
    name: "TACO - Trash Annotations in Context"
    url: "http://tacodataset.org/"
    licence: "Per-image CC BY 4.0 or ODbL"
    required_now: false
    future_purpose: "litter segmentation"
    why_not_now: "Item-level litter granularity; no tabular/geospatial value."
  mapillary_vistas:
    name: "Mapillary Vistas v2.0"
    url: "https://research.mapillary.com/publication/iccv17a/"
    licence: "CC BY-NC-SA"
    required_now: false
    future_purpose: "street-scene pretraining"
    why_not_now: "NonCommercial clause is incompatible with a deployed product."
  civic_issue_dataset:
    name: "Civic Issue Detection Dataset (IIT-K / IBM Research India)"
    url: "https://github.com/Sshanu/civic_issue_dataset"
    licence: "NONE STATED"
    required_now: false
    future_purpose: "Indian civic imagery incl. manholes"
    why_not_now: "Licence could not be verified. Do not use until the authors grant terms."

# ---------------------------------------------------------------------------
# CLEANING - every rule is applied and counted in reports/data_quality.json
# ---------------------------------------------------------------------------
cleaning:
  coordinates:
    reject_zero_island: true          # SF has 551,131 rows at exactly 0,0
    zero_tolerance_deg: 0.0001
    lat_min: -90.0
    lat_max: 90.0
    lon_min: -180.0
    lon_max: 180.0
    city_bbox:
      "San Francisco": {lat_min: 37.60, lat_max: 37.95, lon_min: -123.20, lon_max: -122.28}
      "Boston":        {lat_min: 42.20, lat_max: 42.45, lon_min: -71.25,  lon_max: -70.90}
      "Chicago":       {lat_min: 41.60, lat_max: 42.10, lon_min: -88.00,  lon_max: -87.50}
      "New York City": {lat_min: 40.45, lat_max: 40.95, lon_min: -74.30,  lon_max: -73.65}
  timestamps:
    valid_min: "2008-01-01"
    valid_max_offset_days: 1
    timezone_policy: "convert_to_utc"
    source_timezones:
      sf311: "America/Los_Angeles"
      boston311: "America/New_York"
      chicago311: "America/Chicago"
      nyc311: "America/New_York"
  resolution_time:
    reject_negative: true
    max_hours: 87600                  # 10 years
    # INSTANT-CLOSURE ARTIFACT.
    # A closure recorded less than one minute after the report is not a
    # measurement of service time. Two things establish that, and neither is a
    # hand-picked threshold:
    #
    #  1. RESOLUTION. One minute is the coarsest timestamp granularity in the
    #     sources. 90.8% of SF `requested_datetime` values and 57.7% of NYC
    #     `created_date` values land exactly on :00 seconds, so for those
    #     publishers a sub-minute duration is below what the data can express.
    #  2. SHAPE. The sub-minute population is a machine signature, not a tail of
    #     the service-time distribution. Chicago has 18,279 cases closed at
    #     exactly 7 seconds, 18,125 at 6 s and 14,578 at 5 s — a transactional
    #     write, not field work. NYC's entire sub-minute population sits at
    #     exactly 0 s (7,640 rows) with just 5 rows in the whole 1-60 s range.
    #     Past 60 s the counts rise again into the real distribution.
    #
    # These rows are NOT deleted and NOT clipped. resolution_time_hours becomes
    # NULL — the same treatment negative and over-cap durations already get —
    # and `resolution_instant_closure` marks them so the population stays
    # auditable and can be modelled separately. The case is still known to be
    # closed; only its duration is unmeasurable.
    min_observable_seconds: 60
  text:
    lowercase: false
    strip_html: true
    collapse_whitespace: true
    max_length: 4000
  quarantine:
    enabled: true
    dir: "data/processed/quarantine"

# ---------------------------------------------------------------------------
# IMAGES - no image is downloaded by this pipeline, ever.
# ---------------------------------------------------------------------------
images:
  download_images: false
  policy: >
    The current ML scope has no image task. SF Media URL and Boston photo URLs
    are retained as metadata/provenance in incidents.image_url only. The probe
    script checks a sample of URLs for availability; it never bulk-downloads.
  url_probe:
    sample_size: 200
    timeout_seconds: 15
    max_workers: 8
    method: "HEAD"
    user_agent: "UrbanEyePlus-DataPipeline/2.0 (academic research)"

# ---------------------------------------------------------------------------
# HOTSPOT PANEL
# ---------------------------------------------------------------------------
hotspot:
  # complete_grid : reindex onto a full calendar-week grid so that a week with
  #                 no report is a real zero, shift(1) is genuinely week t-1 and
  #                 the target is genuinely week t+1.
  # observed_only : the old behaviour — rows only for weeks that had incidents.
  #                 shift() then skips quiet weeks and the target can never be
  #                 zero, which made future_incident_flag constant True.
  panel: complete_grid
  drop_partial_boundary_weeks: true
  note: >
    Zeros are observed, not imputed: each city's extract is contiguous in the
    publisher's own id order, so within its date window it is complete for the
    complaint types it covers. Series are created only for zone x category
    combinations that occur at least once in that city.

# ---------------------------------------------------------------------------
# SPLITS
# ---------------------------------------------------------------------------
splits:
  tabular:
    strategy: chronological
    # Preferred ABSOLUTE cut dates. They are used only when they actually fall
    # inside the corpus being split. The subset currently on disk ends in
    # August 2020, so these two dates would put 100% of rows in train and leave
    # val and test empty — which is exactly what happened before this was fixed.
    train_end: "2022-12-31"
    val_end: "2023-12-31"
    # What to do when the absolute cuts do not produce a usable val AND test:
    # fall back to quantile cuts on the corpus's own timeline. The chosen cut
    # timestamps are recorded in every split report, so a run stays reproducible
    # and auditable whichever branch was taken.
    cut_selection: auto              # auto | absolute | quantile
    fractions: {train: 0.70, val: 0.15, test: 0.15}
    # Split each source_dataset on its OWN timeline.
    #
    # The three cities in this corpus occupy disjoint time windows (NYC Jan-Mar
    # 2010, SF Jan-May 2018, Chicago Jul 2018-Aug 2020). One global chronological
    # cut therefore yields a validation and test set containing Chicago and
    # nothing else, so `city` could never be evaluated. Splitting per source
    # keeps every city present in every split while preserving the property that
    # matters for leakage: within a city, train strictly precedes val strictly
    # precedes test. Backward-looking features are computed per row against
    # earlier reports only, and no cross-city feature exists (the density radius
    # is 250 m), so a later row in one city cannot inform an earlier row in
    # another.
    per_source: true
    min_rows_per_split: 1
    # POOLED-MODEL POLICY.
    # per_source: true guarantees chronology WITHIN a city, not across the
    # corpus. Measured on this data, 19.5% of resolution test rows (every SF and
    # NYC test row) fall before the last Chicago training row on one wall clock,
    # so a model pooled across cities would be scored partly on the past.
    #
    # Every table therefore carries BOTH columns, and each task manifest says
    # which to use:
    #   split         per-source chronological  -> PER-CITY models
    #   split_global  one global cut            -> POOLED models
    #
    # split_global's cost is stated rather than hidden: SF ends May 2018 and NYC
    # ends March 2010, so a global cut puts Chicago alone in val and test.
    emit_global_split_column: true
    per_source_split_column: split
    pooled_split_column: split_global
    note: >
      Random splitting would leak future municipal behaviour into the past and
      make the resolution model look far better than it is.
  duplicates:
    strategy: group_chronological
    group_key: incident_a
    note: "A duplicate group is never split across train/val/test."
  hotspot:
    strategy: chronological_by_week
    note: "Lag features are shift(1); the current week never sees itself."
