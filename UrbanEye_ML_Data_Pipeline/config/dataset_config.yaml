# UrbanEye+ ML data pipeline — dataset configuration
#
# SCOPE NOTE (changed from the earlier research phase):
# The citizen selects the category in the UrbanEye+ app, so image->category and
# image->severity models are out of scope. This pipeline is TABULAR + GEOSPATIAL
# only. RDD2022 and Smartathon are documented in DATASET_SOURCES.md and their
# scripts kept under optional_future_vision/, but they are NOT part of the core
# pipeline and you do not need to download them.
#
# Provenance legend used throughout:
#   SOURCE  - taken verbatim (or normalised) from the publisher
#   DERIVED - computed by this pipeline from SOURCE fields
#   SYSTEM  - produced at runtime by the UrbanEye+ backend (India PostGIS). NOT here.
#   NULL    - genuinely unavailable; deliberately left empty

pipeline_version: "2.0.0"
schema_version: "2.0.0"
scope: "tabular_geospatial_only"

paths:
  raw: data/raw
  processed: data/processed
  manifests: data/manifests
  external: data/external
  reports: reports

datasets:

  sf311:
    name: "SF 311 Cases"
    kind: tabular
    city: "San Francisco"
    country: "USA"
    role: "incident history, resolution time, temporal/geographic patterns, weak duplicate signal"
    landing_page: "https://data.sf.gov/d/vw6y-z8j6"
    download:
      recommendation: "SUBSET"
      recommendation_reason: >
        The full asset is ~8.9M rows across ~52 columns, most of which are legacy
        'DELETE - ...' georegion columns. The Socrata API lets you project ~20
        columns and floor the date, cutting the transfer by roughly 70%.
      bulk_csv_url: "https://data.sf.gov/api/v3/views/vw6y-z8j6/export.csv?accessType=DOWNLOAD"
      api_url: "https://data.sf.gov/resource/vw6y-z8j6.json"
      expected_raw_filenames: ["sf311_cases.jsonl", "sf311_bulk_export.csv"]
      raw_dir: "data/raw/sf311"
    socrata:
      domain: "data.sf.gov"
      dataset_id: "vw6y-z8j6"
      resource_url: "https://data.sf.gov/resource/vw6y-z8j6.json"
      page_size: 50000
      order_by: "service_request_id"
      select:
        - service_request_id
        - requested_datetime
        - closed_date
        - updated_datetime
        - status_description
        - status_notes
        - agency_responsible
        - service_name
        - service_subtype
        - service_details
        - address
        - street
        - supervisor_district
        - neighborhoods_sffind_boundaries
        - analysis_neighborhood
        - police_district
        - lat
        - long
        - source
        - media_url
      min_requested_datetime: "2018-01-01"
    expected:
      approx_rows_full: 8909991
      approx_rows_since_2018: 3500000
      date_range: "2008-07-01 .. present"
      verified_on: "2026-09-13 against live Socrata column metadata"
    licence:
      name: "Open Data Commons Public Domain Dedication and Licence (PDDL) 1.0"
      url: "http://opendatacommons.org/licenses/pddl/1.0/"
      commercial_use: true
      modification: true
      redistribution: true
      attribution_required: false
      research_use: true
      restrictions: "None. Public domain dedication."
      decision: INCLUDE

