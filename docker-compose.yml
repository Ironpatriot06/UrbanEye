services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: urbaneye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbaneye
      POSTGRES_PASSWORD: urbaneye_dev
      POSTGRES_DB: urbaneye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
